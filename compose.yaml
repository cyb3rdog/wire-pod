services:
  wire-pod:
    container_name: wire-pod
    hostname: escapepod
    build:
      context: .
      dockerfile: dockerfile
    image: ghcr.io/kercre123/wire-pod:main
    restart: unless-stopped
    environment:
      # Internal mount points -- must match the `volumes:` section below.
      # Not meant to be overridden independently of it.
      WIREPOD_DATA_DIR: /data
      WIREPOD_IMAGES_DIR: /images

      # Everything below only seeds wire-pod's config the very first time
      # it starts (before chipper/apiConfig.json exists in ./data). After
      # that, the dashboard (Server Settings) is authoritative and these
      # are ignored on restart -- change settings there, not here, once
      # you're set up. Override any of these via a `.env` file next to
      # this compose.yaml, or `WIREPOD_FOO=bar docker compose up -d`,
      # without editing this file.
      WIREPOD_DEBUG_LOGGING: ${WIREPOD_DEBUG_LOGGING:-true}
      WIREPOD_USE_INBUILT_BLE: ${WIREPOD_USE_INBUILT_BLE:-false}

      # STT: which backend, its language (vosk/whisper.cpp), and -- for
      # the "whisper" backend -- the HTTP endpoint to use. Leave
      # WIREPOD_STT_WHISPER_URL unset to use the real OpenAI API (needs
      # WIREPOD_STT_WHISPER_KEY); point it at a self-hosted
      # OpenAI-compatible server (e.g. faster-whisper-server) instead to
      # avoid needing a key at all.
      WIREPOD_STT_SERVICE: ${WIREPOD_STT_SERVICE:-vosk}
      WIREPOD_STT_LANGUAGE: ${WIREPOD_STT_LANGUAGE:-en-US}
      WIREPOD_PICOVOICE_APIKEY: ${WIREPOD_PICOVOICE_APIKEY:-}
      WIREPOD_STT_WHISPER_URL: ${WIREPOD_STT_WHISPER_URL:-}
      WIREPOD_STT_WHISPER_KEY: ${WIREPOD_STT_WHISPER_KEY:-}
      WIREPOD_STT_WHISPER_MODEL: ${WIREPOD_STT_WHISPER_MODEL:-}

      # Knowledge graph / "Ask" (LLM fallback for unmatched speech).
      WIREPOD_KNOWLEDGE_ENABLED: ${WIREPOD_KNOWLEDGE_ENABLED:-false}
      WIREPOD_KNOWLEDGE_PROVIDER: ${WIREPOD_KNOWLEDGE_PROVIDER:-}
      WIREPOD_KNOWLEDGE_KEY: ${WIREPOD_KNOWLEDGE_KEY:-}
      WIREPOD_KNOWLEDGE_ID: ${WIREPOD_KNOWLEDGE_ID:-}

      # Weather intent.
      WIREPOD_WEATHERAPI_ENABLED: ${WIREPOD_WEATHERAPI_ENABLED:-false}
      WIREPOD_WEATHERAPI_PROVIDER: ${WIREPOD_WEATHERAPI_PROVIDER:-}
      WIREPOD_WEATHERAPI_KEY: ${WIREPOD_WEATHERAPI_KEY:-}
      WIREPOD_WEATHERAPI_UNIT: ${WIREPOD_WEATHERAPI_UNIT:-}

      # These have no dashboard settings page at all, so unlike everything
      # above they apply live on every restart, not just the first boot.
      # VOSK_THERMAL_ENABLED/VOSK_WITH_GRAMMER only affect the Vosk
      # backend (tuning meant for slow hardware like the RPi Zero 2W --
      # pure overhead on a normal server or NAS, hence the off switch).
      WIREPOD_VOSK_THERMAL_ENABLED: ${WIREPOD_VOSK_THERMAL_ENABLED:-true}
      WIREPOD_VOSK_WITH_GRAMMER: ${WIREPOD_VOSK_WITH_GRAMMER:-false}
      WIREPOD_DISABLE_MDNS: ${WIREPOD_DISABLE_MDNS:-false}
      # Legacy :8084 TLS listener, kept for 2.0.1-era robot firmware
      # compatibility. Inverted sense (true = disabled) -- an intentional
      # exception to the _ENABLED naming used elsewhere in this file,
      # since this var predates it and real deployments already set it.
      WIREPOD_NO8084: ${WIREPOD_NO8084:-false}
      WIREPOD_JDOCS_PINGER_ENABLED: ${WIREPOD_JDOCS_PINGER_ENABLED:-true}
      # Bot remote-control features (eye color, volume, Alexa opt-in, camera
      # streaming), the jdocs pinger, and its mDNS discovery -- all bolted
      # onto the core voice pipeline (STT/intents/knowledge-graph, gRPC on
      # :443), which never imports this package and is unaffected by
      # disabling it. Set to "false" to turn all of that off and hide the
      # "Bot Settings" dashboard page. Port 80 itself STAYS bound and
      # still answers /ok either way: that's what a paired robot's
      # server_config.json ("check" field, no port = defaults to 80)
      # relies on for its basic connectivity check-in, independent of
      # whether SDK-specific features are wanted.
      WIREPOD_SDK_ENABLED: ${WIREPOD_SDK_ENABLED:-true}
      # Whether wire-pod binds its own :80 socket at all, independent of
      # WIREPOD_SDK_ENABLED above: that one decides which handlers exist
      # on the shared mux (bot remote control, /ok, ...), this decides
      # whether a *separate* port 80 listener exists to reach them
      # through -- :8080 serves that same mux either way, behind the same
      # dashboard auth. Set to "false" if you don't want port 80 bound at
      # all (e.g. only forwarding :8080 through a reverse proxy); a
      # paired robot's own connectivity check-in relies on port 80
      # specifically and will not get answered once this is off.
      WIREPOD_PORT80_ENABLED: ${WIREPOD_PORT80_ENABLED:-true}
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
      - "8084:8084"
    volumes:
      - ./data:/data
      - ./images:/images
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/ok" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
